name: CI

on:
  push:
  pull_request:

jobs:
  cpu-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ".[test]"
          python -m pip install torch==2.9.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src scripts tests
